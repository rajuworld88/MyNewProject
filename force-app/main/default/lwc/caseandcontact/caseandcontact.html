<template>
     <lightning-card title="Create Case & Contact">
        <div class="slds-p-around_medium">
            <lightning-input label="Contact First Name" value={firstName} onchange={handleFirstName}></lightning-input>
            <lightning-input label="Contact Last Name" value={lastName} onchange={handleLastName}></lightning-input>
            <lightning-input label="Contact Email" value={email} onchange={handleEmail}></lightning-input>
            <lightning-input label="Case Subject" value={subject} onchange={handleSubject}></lightning-input>
            <lightning-textarea label="Case Description" value={description} onchange={handleDescription}></lightning-textarea>
            
            <lightning-button 
                variant="brand"
                label="Save"
                onclick={handleSave}
                class="slds-m-top_medium">
            </lightning-button>
        </div>
    </lightning-card>
    
</template>
