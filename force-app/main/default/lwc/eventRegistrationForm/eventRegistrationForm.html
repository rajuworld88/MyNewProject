<template>
    <lightning-card title="Create Event" icon-name="action:new_event">
        <div class="slds-m-around_medium">
            <lightning-input label="Event Name" value={name} onchange={handlename} required></lightning-input>
            <lightning-input label="Event Date" type="date" value={date} onchange={handledate} required></lightning-input>
            <lightning-input label="Location" value={location} onchange={handlelocation} required></lightning-input>
            <lightning-input label="Maximum Capacity" type="number" value={capacity} onchange={handlecapacity} required></lightning-input>
            <lightning-button label="Save" onclick={handledata} class="slds-m-top_medium" variant="brand"></lightning-button>
        </div>
    </lightning-card>
</template>
