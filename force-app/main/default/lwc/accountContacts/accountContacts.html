<template>
    <lightning-card title="Accounts">

        <lightning-datatable
            key-field="Id"
            data={accounts}
            columns={columns}
            onrowaction={handleRowAction}
            hide-checkbox-column>
        </lightning-datatable>

    </lightning-card>

    <!-- Contacts section -->
    <template if:true={showContacts}>

        <lightning-card title="Related Contacts">

            <lightning-datatable
                key-field="Id"
                data={contacts}
                columns={contactColumns}
                hide-checkbox-column>
            </lightning-datatable>

        </lightning-card>

    </template>

    <template if:true={noContacts}>
        <p class="slds-p-around_medium">
            No related Contacts found for this Account.
        </p>
    </template>
</template>
