<template>
    

    <lightning-card title="Dynamic Form">

        <template if:true={shownamefield}>
          
            <lightning-input label="Name"></lightning-input>
        </template>
         <template if:true={showemailfield}>
            <lightning-input label="Email"></lightning-input>
         </template>
    
       

    </lightning-card>
</template>
